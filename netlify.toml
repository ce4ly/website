# No hay fallback SPA: cada página está pre-renderizada y lo demás recibe /404.html con estado
# 404, que Netlify sirve por defecto.

# --- Cabeceras ---------------------------------------------------------------------------------
# Todo se sirve desde el propio sitio. Únicas excepciones de la CSP:
# - frame-src: el reproductor de SoundCloud en /boletines/.
# - media-src: los streams de las radios del easter egg de la portada (src/lib/emisoras.ts).
# - img-src: teselas de OpenStreetMap del mapa del Grid Maidenhead (src/lib/mapa.ts).
# - connect-src: buscador de ciudades del Grid Maidenhead, Nominatim (src/lib/lugares.ts).
# - img-src data: imágenes en línea de los SVG del navegador (p. ej. controles de formulario).
# El HTML no lleva scripts ni estilos en línea (el tema se aplica con /tema.js); si se añade
# alguno, o un recurso externo, hay que ajustar la CSP.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org; frame-src https://w.soundcloud.com; media-src 'self' https://audio3.tustreaming.cl https://audio5.tustreaming.cl https://audio0.tustreaming.cl; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # geolocation=(self): el locator Maidenhead ofrece usar la posición del dispositivo.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=()"

# Archivos con hash en el nombre (Vite): pueden cachearse para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El navegador debe revisar siempre si hay un service worker nuevo.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Netlify no conoce la extensión .webmanifest y la serviría como application/octet-stream.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
