# Node: versión de .nvmrc (la lee Netlify). Lint, formato y tests antes del build: si fallan, no se publica.
[build]
  command = "npm run lint && npm run format:check && npm test && npm run build"
  publish = "dist"

# --- Proxies ---------------------------------------------------------------------------------
# Datos de otro origen servidos desde el propio sitio (sin CORS y con la CSP en 'self'). Deben
# coincidir con PROXIES (src/lib/proxies.ts); tests/netlify.test.ts lo comprueba.

[[redirects]]
  from = "/boletines.xml"
  to = "https://feeds.soundcloud.com/users/soundcloud:users:1676930966/sounds.rss"
  status = 200

[[redirects]]
  from = "/api/solar.xml"
  to = "https://www.hamqsl.com/solarxml.php"
  status = 200

# Clima de las capitales del Maule y Constitución (Open-Meteo, sin clave): ver src/lib/clima.ts.
[[redirects]]
  from = "/api/clima.json"
  to = "https://api.open-meteo.com/v1/forecast?latitude=-34.9828,-35.4264,-35.8467,-35.9671,-35.3333&longitude=-71.2394,-71.6554,-71.5931,-72.3225,-72.4167&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=America/Santiago"
  status = 200

# --- Redirecciones permanentes -----------------------------------------------------------------
# URLs antiguas del feed (servidor PHP) → feed actual. Los lectores RSS actualizan la suscripción.

[[redirects]]
  from = "/feedBoletines.php"
  to = "/boletines.xml"
  status = 301
  force = true

[[redirects]]
  from = "/feedBoletines.xml"
  to = "/boletines.xml"
  status = 301
  force = true

[[redirects]]
  from = "/api/boletines.php"
  to = "/boletines.xml"
  status = 301
  force = true

